version: "3.8"

services:
  db:
    image: mysql:8.0
    container_name: thewall_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: thewall
      MYSQL_USER: walluser
      MYSQL_PASSWORD: wallpassword
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build: ./backend
    container_name: thewall_backend
    restart: always
    environment:
      - DATABASE_URL=mysql+pymysql://walluser:wallpassword@db:3306/thewall
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    depends_on:
      - db

  redis:
    image: redis:7-alpine
    container_name: thewall_redis
    restart: always
    ports:
      - "6379:6379"
    # No environment variables needed for default configuration

volumes:
  mysql_data:
